name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile app.py data_client.py quota_worker.py build.py
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: CodexUsageWidget-windows-x64
          path: dist/CodexUsageWidget-windows-x64.zip
